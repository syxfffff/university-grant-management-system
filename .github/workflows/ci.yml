name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1 ruff==0.14.2
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test --verbosity 2
      - run: python manage.py collectstatic --noinput
      - run: python -m pip_audit -r requirements.txt
      - name: Production configuration check
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-configuration-check-key-with-at-least-fifty-characters-12345
          DJANGO_ALLOWED_HOSTS: example.invalid
        run: python manage.py check --deploy --fail-level WARNING
